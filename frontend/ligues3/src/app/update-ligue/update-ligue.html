<div class="container">
    <div>
        <h2>Modifier une Ligue :</h2>
    </div>
    <form>
    <div class="col-sm-2 col-md-2 col-lg-2">
        <label>ID Ligue</label>
        <input readonly type="text" [(ngModel)]="currentLigue.idLigue" name="idLigue" class="form-control">
    </div>
        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>Nom Ligue</label>
            <input type="text" [(ngModel)]="currentLigue.nomLigue" name="nomLigue" class="form-control">
        </div>
        <div class="col-sm-2 col-md-2 col-lg-2">
            <label>Nb Équipes</label>
            <input type="number" [(ngModel)]="currentLigue.nbEquipes" name="nbEquipes" class="form-control">
        </div>
        <div class="col-sm-4 col-md-4 col-lg-4">
            <label>Date création</label>
            <input type="date" [ngModel]="currentLigue.dateCreation | date: 'yyyy-MM-dd'"
                (ngModelChange)=" currentLigue.dateCreation= $event" name="dateCreation" class="form-control">
        </div>
        <label>Pays</label>
        <select class="form-control form-control-lg" id="idPays" name="idPays" [(ngModel)]="updatedPaysId">
            @for (p of lesPays; track p.idPays) {
            <option [value]="p.idPays">{{p.nomPays}}</option>
                }
        </select>
       
        <div class="mt-2">
            <button type="submit" (click)="updateLigue()" class="btn btn-success">Modifer</button>
        </div>
    </form>
</div>
