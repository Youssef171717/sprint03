<div class="container">
  <div class="card shadow mb-4">
    <div class="card-body">
    <div class="col-sm-4 col-md-4 col-lg-4 mb-4">
    <app-update-pays
    [pays]="updatedPays"
    (paysUpdated)="paysUpdated($event)"
    [ajout]="ajout">
    </app-update-pays>
    
    </div>
      <table class="table table-striped">
        <thead>
          <tr> <th>Id</th><th>Nom Pays</th><th>Action</th></tr>
        </thead>
        @for(p of lesPays; track p.idPays)
        {
          <tbody>
            <tr>
              <td>{{p.idPays}}</td>
              <td>{{p.nomPays}}</td>
              <td><a class="btn btn-success" (click)="updatePays(p)">Editer</a></td>
            </tr>
          </tbody>
        }
      </table>
    </div>
  </div>
</div>
